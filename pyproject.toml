[tool.poetry]
name = "spotfishing"
version = "0.3.3"
description = "Detecting spots in FISH images"
authors = [
    "Vince Reuter <vince.reuter@gmail.com>",
]
readme = "README.md"
license = "MIT"
repository = "https://github.com/gerlichlab/spotfishing"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",    
    "Typing :: Typed",
]
packages = [
    { include = "spotfishing" }, 
    { include = "spotfishing_looptrace" }
]
include = ["examples"]

[tool.poetry.dependencies]
# These are the main runtime dependencies.
python = ">= 3.11, < 3.13"
gertils = { git = "https://github.com/gerlichlab/gertils.git", tag = "v0.6.1" }
numpy = "^1.24.2"
numpydoc_decorator = "^2.2.1"
pandas = "^1.5.3"
scikit-image = ">=0.20.0"
scipy = "^1.10.1"
typing-extensions = ">=4.9"

[tool.poetry.group.nox]
optional = true

[tool.poetry.group.nox.dependencies]
nox = "^2022.11.21"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
hypothesis = "^6.68.2"
pytest-cov = "^5.0.0"
pytest = "^7.1.0"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
hypothesis = "^6.68.2"
pyright = "^1.1.411"
nox = "^2022.11.21"
pandas-stubs = "^2.2.0.240218"
pylint = "^2.15.8"
pytest = "^7.1.0"
scipy-stubs = ">=1.15,<1.16"

[tool.poetry.group.format]
optional = true

[tool.poetry.group.format.dependencies]
codespell = "^2.2.2"
# The version looptrace pins, so the two projects are formatted and linted by the same ruff.
ruff = "==0.7.4"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
# The dev group is for developers' convenience. 
# Consider each new dependency to another group as a dev group candidate.
codespell = "^2.2.2"
hypothesis = "^6.68.2"
pyright = "^1.1.411"
nox = "^2022.11.21"
pandas-stubs = "^2.2.0.240218"
pylint = "^2.15.8"
pytest = "^7.1.0"
pytest-cov = "^5.0.0"
ruff = "==0.7.4"
scipy-stubs = ">=1.15,<1.16"

[tool.codespell]
skip = ".git,,.nox,.vscode,__pycache__,pyproject.toml,poetry.lock"
builtin = "clear,rare,informal,usage,code,names"
ignore-words-list = "jupyter,iff"  # prevent jupyter -> jupiter, iff -> if
check-filenames = true
uri-ignore-words-list = "*" # prevent spelling correction in URL-like values.

[tool.pyright]
include = ["spotfishing", "spotfishing_looptrace", "tests", "noxfile.py"]
# The packages get strict checking; the tests and the noxfile get the standard level.
strict = ["spotfishing", "spotfishing_looptrace"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pylint]
main.jobs = 4
main.py-version = "3.11"
# An "import X as X" in a package's __init__ re-exports X, which is how pyright tells it from an unused import.
imports.allow-reexport-from-package = true
reports.output-format = "colorized"
"messages control".disable = "logging-fstring-interpolation,unspecified-encoding,wildcard-import,use-dict-literal,fixme,wrong-import-position,line-too-long,no-name-in-module"

[tool.ruff]
# Black uses line-length = 88, but allows exceptions when breaking the line
# would lead to other rule violations. Use 100 as a maximum hard limit:
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
