name: Tests 

on: [workflow_call]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Gr1N/setup-poetry@v8
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          # Keyed on the full Python version, such as 3.12.11: an environment points at
          # the Python that made it, which the runner drops when its image moves to the
          # next patch release.
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-poetry-tests-${{ hashFiles('poetry.lock') }}
      - name: Install project
        run: poetry sync --no-interaction --with test
      - name: Run unit tests on Python ${{ matrix.python-version }}
        run: poetry run pytest -vv
